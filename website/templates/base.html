<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}To-Do App{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='lab4.css') }}">
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-start items-center p-4 transition-colors duration-200">


  <div class="w-full {% block width %}max-w-lg{% endblock %} flex justify-end pt-2">
    <button id="theme-toggle" type="button"
            class="text-xs px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition">
      🌙 Dark Mode
    </button>
  </div>

  <div class="w-full {{ self.width() }} my-4">
    {% block content %}{% endblock %}
  </div>


</body>
</html>
