{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="space-y-2">
      {% for category, msg in messages %}
        {% if category == 'success' %}
          <div class="p-2.5 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 rounded-lg text-xs">{{ msg }}</div>
        {% else %}
          <div class="p-2.5 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-300 rounded-lg text-xs">{{ msg }}</div>
        {% endif %}
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
